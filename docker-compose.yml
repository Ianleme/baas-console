name: baas-console

x-database-environment: &database-environment
  DATABASE_HOST: mysql
  DATABASE_PORT: 3306
  DATABASE_NAME: ${BAAS_DB_NAME:-baas}
  DATABASE_USER: ${BAAS_DB_USER:-baas}
  DATABASE_PASSWORD: ${BAAS_DB_PASSWORD:-baas-development-password}

services:
  mysql:
    image: mysql:8.4.8@sha256:2952e3be7807f06fc18de50b3ea1a632d5c70d63482ff7d7376fe3aa8999babf
    environment:
      MYSQL_DATABASE: ${BAAS_DB_NAME:-baas}
      MYSQL_USER: ${BAAS_DB_USER:-baas}
      MYSQL_PASSWORD: ${BAAS_DB_PASSWORD:-baas-development-password}
      MYSQL_ROOT_PASSWORD: ${BAAS_DB_ROOT_PASSWORD:-baas-development-root-password}
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent']
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 20s
    networks: [data]
    volumes:
      - mysql-data:/var/lib/mysql

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ['node', 'apps/api/dist/database/migrate.js']
    environment: *database-environment
    depends_on:
      mysql:
        condition: service_healthy
    networks: [data]
    read_only: true
    tmpfs: [/tmp]
    restart: 'no'

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      <<: *database-environment
      PORT: 3000
      AUTH_TOKEN_SECRET: ${AUTH_TOKEN_SECRET:?AUTH_TOKEN_SECRET is required}
      ENCRYPTION_KEY_BASE64: ${ENCRYPTION_KEY_BASE64:?ENCRYPTION_KEY_BASE64 is required}
      LERA_BOX_BASE_URL: ${LERA_BOX_BASE_URL:-https://api.branchpay.com.br}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 10s
    ports:
      - '127.0.0.1:${API_PORT:-3000}:3000'
    networks: [data, edge]
    read_only: true
    tmpfs: [/tmp]
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      PORT: 4173
      API_ORIGIN: http://api:3000
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4173/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    ports:
      - '127.0.0.1:${WEB_PORT:-4173}:4173'
    networks: [edge]
    read_only: true
    tmpfs: [/tmp]
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.30.0@sha256:0059ef81e492a7192af3816281eed6859eb078bd7bdc58b76757c13e10e53a7d
    command: ['--disable-version-check']
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    ports:
      - '127.0.0.1:${MAILPIT_HTTP_PORT:-8025}:8025'
      - '127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025'
    networks: [data, edge]
    restart: unless-stopped

networks:
  data:
    internal: true
  edge:

volumes:
  mysql-data:
