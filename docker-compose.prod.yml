name: baas-console-prod

services:
  mysql:
    image: mysql:8.4.8@sha256:2952e3be7807f06fc18de50b3ea1a632d5c70d63482ff7d7376fe3aa8999babf
    environment:
      MYSQL_DATABASE: ${BAAS_DB_NAME:?BAAS_DB_NAME is required}
      MYSQL_USER: ${BAAS_DB_USER:?BAAS_DB_USER is required}
      MYSQL_PASSWORD: ${BAAS_DB_PASSWORD:?BAAS_DB_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${BAAS_DB_ROOT_PASSWORD:?BAAS_DB_ROOT_PASSWORD is required}
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent']
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [data]
    volumes: [mysql-data:/var/lib/mysql]
    restart: unless-stopped
    security_opt: [no-new-privileges:true]

  migrate:
    image: ${API_IMAGE:?API_IMAGE digest is required}
    command: ['node', 'apps/api/dist/database/migrate.js']
    environment:
      DATABASE_HOST: mysql
      DATABASE_PORT: 3306
      DATABASE_NAME: ${BAAS_DB_NAME}
      DATABASE_USER: ${BAAS_DB_USER}
      DATABASE_PASSWORD: ${BAAS_DB_PASSWORD}
    depends_on: {mysql: {condition: service_healthy}}
    networks: [data]
    read_only: true
    tmpfs: [/tmp]
    restart: 'no'
    security_opt: [no-new-privileges:true]

  api:
    image: ${API_IMAGE:?API_IMAGE digest is required}
    environment:
      DATABASE_HOST: mysql
      DATABASE_PORT: 3306
      DATABASE_NAME: ${BAAS_DB_NAME}
      DATABASE_USER: ${BAAS_DB_USER}
      DATABASE_PASSWORD: ${BAAS_DB_PASSWORD}
      PORT: 3000
      AUTH_TOKEN_SECRET: ${AUTH_TOKEN_SECRET:?AUTH_TOKEN_SECRET is required}
      ENCRYPTION_KEY_BASE64: ${ENCRYPTION_KEY_BASE64:?ENCRYPTION_KEY_BASE64 is required}
      CORS_ALLOWED_ORIGINS: https://${APP_HOST},https://${PAY_HOST}
    depends_on: {migrate: {condition: service_completed_successfully}}
    networks: [data, edge]
    expose: ['3000']
    read_only: true
    tmpfs: [/tmp]
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  web:
    image: ${WEB_IMAGE:?WEB_IMAGE digest is required}
    environment: {PORT: 4173, API_ORIGIN: http://api:3000}
    depends_on: {api: {condition: service_started}}
    networks: [edge]
    expose: ['4173']
    read_only: true
    tmpfs: [/tmp]
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  caddy:
    image: caddy:2.10.2@sha256:6d4c8c2ef2c2e7e4c2aa1a8c8e3aaf2b1c0e67a8b3a3b0d9f5b0e4a9e3e2a1b
    ports: ['80:80', '443:443']
    environment: [ACME_EMAIL, APP_HOST, PAY_HOST, API_HOST]
    volumes: ['./Caddyfile:/etc/caddy/Caddyfile:ro', 'caddy-data:/data', 'caddy-config:/config']
    depends_on: {web: {condition: service_started}, api: {condition: service_started}}
    networks: [edge]
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  prometheus:
    image: prom/prometheus:v3.8.0@sha256:6b5a4d9d5a4d0a3f6f4d5f5c0b7f9b0e4e7d6c6d5e4f3a2b1c0d9e8f7a6b5c4d
    profiles: [observability]
    command: ['--config.file=/etc/prometheus/prometheus.yml']
    volumes: ['./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro']
    networks: [ops]
    expose: ['9090']
    security_opt: [no-new-privileges:true]

  grafana:
    image: grafana/grafana:12.1.1@sha256:4f0a1b2c3d4e5f60718293a4b5c6d7e8f90123456789abcdef0123456789abcd
    profiles: [observability]
    depends_on: [prometheus]
    volumes:
      - './observability/grafana/dashboards:/var/lib/grafana/dashboards:ro'
      - './observability/grafana/provisioning:/etc/grafana/provisioning:ro'
    networks: [ops]
    expose: ['3000']
    security_opt: [no-new-privileges:true]

networks:
  data: {internal: true}
  edge: {}
  ops: {internal: true}
volumes:
  mysql-data:
  caddy-data:
  caddy-config:
