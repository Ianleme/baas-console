name: Mutation

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  mutation:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run verify:full
